name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: ruff check app.py docplainer tests scripts
      - run: ruff format --check app.py docplainer tests scripts
      - run: pytest -q

  retrieval-eval:
    # Real models, so this scores what visitors will actually get. Not part of `test`
    # because it downloads ~200 MB; the cache below makes repeat runs cheap.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -r requirements-dev.txt && pip install -e .
      - uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-${{ hashFiles('docplainer/config.py') }}
      - name: Score retrieval (v1 baseline vs v2)
        env:
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
        run: |
          python -m docplainer.eval --sweep --min-hit-at-k 0.85 --json eval_results.json | tee eval.txt
          { echo '### Retrieval eval'; echo '```'; cat eval.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval_results.json
